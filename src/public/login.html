<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ Music 登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      min-height: 100vh;
    }
    header {
      padding: 18px 24px;
      background: #16191f;
      border-bottom: 1px solid #232830;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #4ea1ff;
    }
    header a {
      margin-left: auto;
      font-size: 13px;
      color: #8a909c;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #2a313c;
      border-radius: 6px;
      transition: all .15s;
    }
    header a:hover { color: #4ea1ff; border-color: #4ea1ff; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 4px;
      vertical-align: middle;
    }
    .status-dot.online { background: #4ade80; }
    .status-dot.offline { background: #f87171; }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid #232830;
    }
    .tabs button {
      padding: 10px 22px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #8a909c;
      font-size: 14px;
      cursor: pointer;
      transition: all .15s;
    }
    .tabs button:hover { color: #c0c5cf; }
    .tabs button.active {
      color: #4ea1ff;
      border-bottom-color: #4ea1ff;
    }

    .section {
      background: #16191f;
      border: 1px solid #232830;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .section h2 {
      margin: 0 0 18px 0;
      font-size: 15px;
      color: #c0c5cf;
      font-weight: 600;
      border-left: 3px solid #4ea1ff;
      padding-left: 10px;
    }

    /* QQ 二维码登录 */
    .qr-wrap {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .qr-box {
      width: 200px;
      height: 200px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    .qr-box.loading::after {
      content: "加载中…";
      color: #555;
      font-size: 13px;
    }
    .qr-info {
      flex: 1;
      min-width: 240px;
    }
    .qr-state {
      font-size: 14px;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #1a1e26;
      border: 1px solid #2a313c;
    }
    .qr-state.scan { border-color: #4ea1ff; color: #4ea1ff; }
    .qr-state.conf { border-color: #facc15; color: #facc15; }
    .qr-state.done { border-color: #4ade80; color: #4ade80; }
    .qr-state.err { border-color: #f87171; color: #f87171; }
    .qr-hint {
      font-size: 12px;
      color: #6a7080;
      line-height: 1.8;
    }

    /* 手机登录 */
    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .form-row label {
      font-size: 13px;
      color: #8a909c;
      min-width: 80px;
    }
    .form-row input {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      background: #1a1e26;
      border: 1px solid #2a313c;
      border-radius: 6px;
      color: #e6e6e6;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .form-row input:focus { border-color: #4ea1ff; }
    .form-row input::placeholder { color: #5a6170; }
    .form-row input.small { flex: 0 0 100px; }
    .form-row button {
      padding: 10px 18px;
      background: #4ea1ff;
      color: #0f1115;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .form-row button:hover:not(:disabled) { background: #6bb3ff; }
    .form-row button:disabled { background: #2a313c; color: #6a7080; cursor: not-allowed; }
    .form-row .countdown {
      font-size: 12px;
      color: #6a7080;
      min-width: 60px;
    }

    /* 当前状态卡片 */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .stat-item {
      background: #1a1e26;
      border: 1px solid #2a313c;
      border-radius: 6px;
      padding: 12px;
    }
    .stat-item .k {
      font-size: 11px;
      color: #6a7080;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .stat-item .v {
      font-size: 13px;
      color: #e6e6e6;
      font-family: monospace;
      word-break: break-all;
    }
    .stat-item .v.ok { color: #4ade80; }
    .stat-item .v.warn { color: #facc15; }
    .stat-item .v.err { color: #f87171; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .actions button {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid #2a313c;
      background: #1a1e26;
      color: #c0c5cf;
    }
    .actions button:hover:not(:disabled) { border-color: #4ea1ff; color: #4ea1ff; }
    .actions button:disabled { opacity: .5; cursor: not-allowed; }
    .actions button.danger { border-color: #5e2d2d; color: #f87171; }
    .actions button.danger:hover:not(:disabled) { background: #2a1717; color: #f87171; }

    /* 用户信息卡片 */
    .user-card {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }
    .user-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #232830;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid #2a313c;
    }
    .user-main {
      flex: 1;
      min-width: 220px;
    }
    .user-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .user-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1a1e26;
      border: 1px solid #2a313c;
      color: #8a909c;
    }
    .tag.vip { color: #facc15; border-color: #5e512d; }
    .tag.green { color: #4ade80; border-color: #2d5e3c; }
    .tag.blue { color: #4ea1ff; border-color: #2d4a5e; }
    .user-meta {
      font-size: 12px;
      color: #8a909c;
      line-height: 1.7;
    }
    .user-meta span { margin-right: 14px; }
    .raw-toggle {
      margin-top: 14px;
      font-size: 12px;
      color: #4ea1ff;
      cursor: pointer;
      user-select: none;
    }
    .raw-toggle:hover { text-decoration: underline; }
    .raw-json {
      margin-top: 10px;
      max-height: 300px;
      overflow: auto;
      background: #0f1115;
      border: 1px solid #2a313c;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
      color: #c0c5cf;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.info { background: #1a1e26; border: 1px solid #2a313c; color: #c0c5cf; }
    .msg.ok { background: #16291c; border: 1px solid #2d5e3c; color: #4ade80; }
    .msg.err { background: #2a1717; border: 1px solid #5e2d2d; color: #f87171; word-break: break-all; }

    .hidden { display: none !important; }

    /* 公告/联系方式表单: 两列 grid, 输入框等宽 */
    .site-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    .site-form .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 0;
      align-items: stretch;
    }
    .site-form .form-row label { min-width: 0; }
    .site-form .form-row input,
    .site-form .form-row textarea { width: 100%; box-sizing: border-box; min-width: 0; }
    .site-form .form-check { flex-direction: row; align-items: center; gap: 8px; }
    .site-form .form-check label { cursor: pointer; }
    .site-form .form-check input { width: 16px; height: 16px; accent-color: #4ea1ff; cursor: pointer; }
    .site-form .span-2 { grid-column: 1 / -1; }
    @media (max-width: 640px) { .site-form { grid-template-columns: 1fr; } }

    /* 管理员密钥门 */
    .key-gate {
      position: fixed;
      inset: 0;
      background: #0f1115;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key-gate .gate-card {
      width: 360px;
      background: #16191f;
      border: 1px solid #2a313c;
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }
    .key-gate h2 {
      margin: 0 0 8px;
      font-size: 17px;
      color: #4ea1ff;
    }
    .key-gate p {
      margin: 0 0 18px;
      font-size: 12px;
      color: #6a7080;
      line-height: 1.7;
    }
    .key-gate input {
      width: 100%;
      padding: 11px 14px;
      background: #1a1e26;
      border: 1px solid #2a313c;
      border-radius: 8px;
      color: #e6e6e6;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 1px;
    }
    .key-gate input:focus { border-color: #4ea1ff; }
    .key-gate button {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      background: #4ea1ff;
      color: #0f1115;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .key-gate button:hover { background: #6bb3ff; }
    .key-gate .gate-err {
      margin-top: 12px;
      font-size: 12px;
      color: #f87171;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <!-- 管理员密钥门: 校验通过后才显示后台内容 -->
  <div class="key-gate" id="keyGate">
    <div class="gate-card">
      <h2>管理员访问</h2>
      <p>此页面涉及账号凭证管理, 需要管理员密钥。<br>密钥由服务端 ADMIN_KEY 环境变量配置, 仅保存在本浏览器。</p>
      <input type="password" id="gateKeyInput" placeholder="请输入管理员密钥" autocomplete="off" />
      <button id="gateEnterBtn">进入管理后台</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <header>
    <h1>QQ Music 登录</h1>
    <span class="status-dot" id="statusDot"></span><span id="statusText" style="font-size:12px;color:#8a909c;">检测中…</span>
    <a href="#" id="keyBtn" onclick="return false;" style="color:#facc15;">设置密钥</a>
    <a href="/">返回首页</a>
  </header>

  <div class="container">
    <!-- 当前登录状态 -->
    <div class="section">
      <h2>当前登录状态</h2>
      <div class="stat-grid" id="statGrid"></div>
      <div class="actions">
        <button id="refreshBtn">刷新状态</button>
        <button id="refreshCredBtn">刷新凭证</button>
        <button id="logoutBtn" class="danger">退出登录</button>
      </div>
      <div class="msg" id="statusMsg"></div>
    </div>

    <div class="section">
      <h2>公告与联系方式</h2>
      <div class="site-form">
        <div class="form-row form-check"><label>启用公告弹窗</label><input id="announcementEnabled" type="checkbox"></div>
        <div class="form-row form-check"><label>启用联系按钮</label><input id="contactEnabled" type="checkbox"></div>
        <div class="form-row"><label>公告标题 (最长 120 字)</label><input id="announcementTitle" maxlength="120"></div>
        <div class="form-row"><label>强制阅读秒数 (0-3600)</label><input id="announcementSeconds" type="number" min="0" max="3600" value="0"></div>
        <div class="form-row span-2"><label>公告内容 (支持受限 Markdown, 最长 4000 字)</label><textarea id="announcementContent" maxlength="4000" style="min-height:120px;background:#1a1e26;border:1px solid #2a313c;border-radius:6px;color:#e6e6e6;padding:10px;font-size:13px;"></textarea></div>
        <div class="form-row"><label>联系按钮文字</label><input id="contactLabel" maxlength="20" value="联系"></div>
        <div class="form-row"><label>个人联系文字</label><input id="contactPersonalLabel" maxlength="20" value="个人"></div>
        <div class="form-row"><label>个人联系链接</label><input id="contactPersonalUrl" maxlength="300" placeholder="https://"></div>
        <div class="form-row"><label>个人联系图片</label><input id="contactPersonalImage" maxlength="300" placeholder="https://...png (二维码)"></div>
        <div class="form-row"><label>群组联系文字</label><input id="contactGroupLabel" maxlength="20" value="群组"></div>
        <div class="form-row"><label>群组联系链接</label><input id="contactGroupUrl" maxlength="300" placeholder="https://"></div>
        <div class="form-row"><label>群组联系图片</label><input id="contactGroupImage" maxlength="300" placeholder="https://...png (二维码)"></div>
      </div>
      <div class="actions"><button id="saveSiteBtn">保存公告配置</button></div>
      <div class="msg" id="siteMsg"></div>
    </div>

    <!-- 当前用户信息 -->
    <div class="section hidden" id="userInfoSection">
      <h2>当前用户信息</h2>
      <div id="userInfoBody">
        <div class="user-card" id="userCard"></div>
        <div class="raw-toggle" id="rawToggle">▶ 查看原始 JSON</div>
        <div class="raw-json hidden" id="rawJson"></div>
      </div>
      <div class="msg" id="userInfoMsg"></div>
    </div>

    <!-- 登录方式 -->
    <div class="section">
      <h2>登录方式</h2>
      <div class="tabs">
        <button class="active" data-tab="qr">QQ 二维码登录</button>
        <button data-tab="phone">手机验证码登录</button>
      </div>

      <!-- QQ 二维码 -->
      <div id="qrPanel">
        <div class="qr-wrap">
          <div class="qr-box loading" id="qrBox"></div>
          <div class="qr-info">
            <div class="qr-state" id="qrState">等待获取二维码…</div>
            <div class="qr-hint">
              使用 QQ 手机客户端扫描左侧二维码完成登录。<br>
              状态说明：<br>
              · SCAN  - 已扫码，等待确认<br>
              · CONF  - 已确认，等待授权<br>
              · DONE  - 登录成功<br>
              · REFUSE - 已拒绝<br>
              · TIMEOUT - 二维码已过期，请刷新
            </div>
            <div class="actions">
              <button id="qrRefreshBtn">刷新二维码</button>
            </div>
          </div>
        </div>
        <div class="msg" id="qrMsg"></div>
      </div>

      <!-- 手机验证码 -->
      <div id="phonePanel" class="hidden">
        <div class="form-row">
          <label>国家代码</label>
          <input class="small" id="ccInput" type="text" value="86" />
          <label>手机号</label>
          <input id="phoneInput" type="text" placeholder="11 位手机号" />
        </div>
        <div class="form-row">
          <label>验证码</label>
          <input id="codeInput" type="text" placeholder="6 位验证码" />
          <button id="sendCodeBtn">发送验证码</button>
          <span class="countdown" id="countdown"></span>
        </div>
        <div class="actions">
          <button id="phoneLoginBtn">登录</button>
        </div>
        <div class="msg" id="phoneMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      const MAP = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      };
      return String(s ?? "").replace(/[&<>"']/g, c => MAP[c]);
    }

    // ==================== 管理员密钥 ====================
    // 密钥只保存在浏览器 localStorage, 由服务端环境变量 ADMIN_KEY 校验;
    // 校验通过前整个后台界面被密钥门遮挡.
    function getAdminKey() {
      return localStorage.getItem("qm_admin_key") || "";
    }
    function setAdminKey(k) {
      if (k) localStorage.setItem("qm_admin_key", k);
      else localStorage.removeItem("qm_admin_key");
    }

    async function verifyKey(key) {
      try {
        const r = await fetch("/login/status", { headers: { "X-API-Key": key } });
        if (r.status !== 200) return false;
        const j = await r.json();
        return j.code === 0;
      } catch {
        return false;
      }
    }

    function showGate() {
      $("keyGate").classList.remove("hidden");
      $("gateErr").textContent = "";
      $("gateKeyInput").value = "";
      setTimeout(() => $("gateKeyInput").focus(), 50);
    }

    async function enterAdmin() {
      $("keyGate").classList.add("hidden");
      checkStatus();
      loadQrCode();
      // 无论自动登录还是手动输入密钥, 进入后台都必须先拉取当前配置,
      // 否则表单空值会覆盖服务端已有公告/联系方式
      $("saveSiteBtn").disabled = true;
      loadSite()
        .catch((e) => showMsg($("siteMsg"), "err", `公告配置加载失败: ${e.message}`))
        .finally(() => { $("saveSiteBtn").disabled = false; });
    }

    async function tryEnter() {
      const key = $("gateKeyInput").value.trim();
      if (!key) { $("gateErr").textContent = "请输入密钥"; return; }
      $("gateEnterBtn").disabled = true;
      $("gateErr").textContent = "校验中…";
      $("gateErr").style.color = "#8a909c";
      const ok = await verifyKey(key);
      $("gateEnterBtn").disabled = false;
      $("gateErr").style.color = "";
      if (ok) {
        setAdminKey(key);
        enterAdmin();
      } else {
        $("gateErr").textContent = "密钥错误或服务未配置 ADMIN_KEY";
      }
    }

    $("gateEnterBtn").addEventListener("click", tryEnter);
    $("gateKeyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryEnter();
    });

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      const key = getAdminKey();
      if (key) headers["X-API-Key"] = key;
      const r = await fetch(path, { ...options, headers });
      let j;
      try { j = await r.json(); } catch { throw new Error(`HTTP ${r.status}`); }
      if (r.status === 401) {
        // 密钥失效: 弹出密钥门重新校验
        showGate();
        throw new Error("需要管理员密钥");
      }
      if (j.code !== 0) throw new Error(j.message || `code ${j.code}`);
      return j.data;
    }

    function showMsg(el, type, text) {
      el.className = `msg show ${type}`;
      el.textContent = text;
    }

    // ==================== 状态 ====================

    async function checkStatus() {
      try {
        const d = await api("/login/status");
        $("statusDot").className = "status-dot " + (d.loggedIn ? "online" : "offline");
        $("statusText").textContent = d.loggedIn ? `已登录: ${d.musicid}` : "未登录";
        renderStatus(d);
        // 已登录则加载用户信息, 未登录则隐藏
        if (d.loggedIn) loadUserInfo();
        else $("userInfoSection").classList.add("hidden");
      } catch (e) {
        $("statusDot").className = "status-dot offline";
        $("statusText").textContent = "服务离线";
        showMsg($("statusMsg"), "err", `状态检查失败: ${e.message}`);
        $("userInfoSection").classList.add("hidden");
      }
    }

    function renderStatus(d) {
      const grid = $("statGrid");
      grid.innerHTML = "";
      const items = [
        { k: "登录状态", v: d.loggedIn ? "已登录" : "未登录", cls: d.loggedIn ? "ok" : "err" },
        { k: "musicid", v: d.musicid || "-", cls: "" },
        { k: "凭证过期", v: d.expired ? "是" : "否", cls: d.expired ? "warn" : "ok" },
        { k: "凭证文件", v: d.file || "-", cls: "" }
      ];
      for (const it of items) {
        const el = document.createElement("div");
        el.className = "stat-item";
        el.innerHTML = `<div class="k">${it.k}</div><div class="v ${it.cls}">${it.v}</div>`;
        grid.appendChild(el);
      }
    }

    // ==================== 用户信息 ====================

    async function loadUserInfo() {
      $("userInfoSection").classList.remove("hidden");
      $("userCard").innerHTML = '<div style="color:#6a7080;font-size:13px;">加载中…</div>';
      try {
        const d = await api("/user/self");
        renderUserInfo(d);
      } catch (e) {
        $("userCard").innerHTML = "";
        showMsg($("userInfoMsg"), "err", `获取用户信息失败: ${e.message}`);
      }
    }

    // 深度递归收集所有 {键: 值} 路径 (只处理对象和基本类型)
    function flattenKeys(obj, prefix = "", out = {}) {
      if (obj === null || obj === undefined) return out;
      if (typeof obj !== "object") return out;
      if (Array.isArray(obj)) {
        obj.forEach((v, i) => flattenKeys(v, `${prefix}[${i}]`, out));
        return out;
      }
      for (const [k, v] of Object.entries(obj)) {
        const path = prefix ? `${prefix}.${k}` : k;
        if (v !== null && v !== undefined && typeof v !== "object") {
          out[path] = v;
        } else if (typeof v === "object") {
          flattenKeys(v, path, out);
        }
      }
      return out;
    }

    // 不区分大小写匹配键名
    function pickByKeys(flat, keys) {
      const lowerKeys = keys.map(k => k.toLowerCase());
      for (const [path, v] of Object.entries(flat)) {
        const last = path.split(".").pop().split("[")[0].toLowerCase();
        if (lowerKeys.includes(last)) return v;
      }
      return "";
    }
    // 匹配头像 URL (http 链接且包含图片特征)
    function pickAvatar(flat) {
      // 优先: 键名包含 head/avatar/pic/logo 且值是 URL
      const nameKeys = ["headpic", "headpicurl", "avatar", "avatarurl", "pic", "logo", "head", "portrait", "face", "photo"];
      for (const [path, v] of Object.entries(flat)) {
        const last = path.split(".").pop().split("[")[0].toLowerCase();
        if (nameKeys.includes(last) && typeof v === "string" && /^https?:\/\//.test(v)) return v;
      }
      // 兜底: 任意 URL 值且包含图片特征
      for (const [path, v] of Object.entries(flat)) {
        if (typeof v === "string" && /^https?:\/\//.test(v) && /\.(jpg|jpeg|png|webp|gif)/i.test(v)) return v;
      }
      return "";
    }
    // 匹配昵称 (键名含 nick/name, 值是非空字符串且非数字非 URL)
    function pickNickname(flat) {
      const nameKeys = ["nick", "nickname", "strnickname", "name", "username", "displayname", "strnick"];
      for (const [path, v] of Object.entries(flat)) {
        const last = path.split(".").pop().split("[")[0].toLowerCase();
        if (nameKeys.includes(last) && typeof v === "string" && v.trim() && !/^https?:\/\//.test(v) && isNaN(Number(v))) return v;
      }
      return "";
    }

    function renderUserInfo(d) {
      showMsg($("userInfoMsg"), "", "");
      $("userInfoMsg").classList.remove("show");

      // 把整个响应扁平化, 不再假设 data 包装层
      const flat = flattenKeys(d);
      const nickname = pickNickname(flat);
      const avatar = pickAvatar(flat);
      const uin = pickByKeys(flat, ["uin", "musicid", "struin", "strmusicid", "uid"]);
      const gender = pickByKeys(flat, ["gender", "sex"]);
      const age = pickByKeys(flat, ["age"]);
      const country = pickByKeys(flat, ["country", "countryname"]);
      const province = pickByKeys(flat, ["province", "provincename"]);
      const city = pickByKeys(flat, ["city", "cityname"]);
      const vipLevel = pickByKeys(flat, ["viplevel", "viplevel", "ndiamondlevel", "diamondlevel", "diamond"]);
      const isVip = pickByKeys(flat, ["isvip", "vipflag", "bvip", "isvipUser"]);
      const fansNum = pickByKeys(flat, ["fansnum", "fansnumber", "nfans", "fans"]);
      const followNum = pickByKeys(flat, ["follownum", "follownumber", "nfollows", "follows", "follow"]);
      const songNum = pickByKeys(flat, ["songnum", "songnumber", "nsongnum", "songs"]);
      const playlistNum = pickByKeys(flat, ["playlistnum", "songlistnum", "nsonglist", "playlist"]);
      const intro = pickByKeys(flat, ["intro", "signature", "description", "strintro", "sign"]);

      // 渲染头像 + 昵称
      const card = $("userCard");
      card.innerHTML = "";
      if (avatar) {
        const img = document.createElement("img");
        img.className = "user-avatar";
        img.src = avatar;
        img.alt = "avatar";
        img.onerror = () => { img.style.display = "none"; };
        card.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "user-avatar";
        ph.style.display = "flex";
        ph.style.alignItems = "center";
        ph.style.justifyContent = "center";
        ph.style.fontSize = "32px";
        ph.style.color = "#6a7080";
        ph.textContent = "?";
        card.appendChild(ph);
      }

      const main = document.createElement("div");
      main.className = "user-main";

      const nameEl = document.createElement("div");
      nameEl.className = "user-name";
      nameEl.textContent = nickname || "(未知昵称)";
      main.appendChild(nameEl);

      // 调试提示: 若未识别到昵称/头像, 给出提示
      if (!nickname || !avatar) {
        const tip = document.createElement("div");
        tip.style.cssText = "font-size:11px;color:#facc15;margin-top:4px;";
        const missing = [];
        if (!nickname) missing.push("昵称");
        if (!avatar) missing.push("头像");
        tip.textContent = `⚠ 未识别到${missing.join("/")}，请展开下方原始 JSON 查看实际字段名`;
        main.appendChild(tip);
      }

      // 标签 (所有字段经 escapeHtml, 防止上游资料注入 HTML)
      const tags = document.createElement("div");
      tags.className = "user-tags";
      const tagHtml = [];
      if (isVip || vipLevel) tagHtml.push(`<span class="tag vip">VIP${vipLevel ? " " + escapeHtml(String(vipLevel)) : ""}</span>`);
      if (uin) tagHtml.push(`<span class="tag blue">QQ: ${escapeHtml(String(uin))}</span>`);
      if (gender !== "") {
        const g = String(gender) === "1" ? "男" : String(gender) === "2" ? "女" : "保密";
        tagHtml.push(`<span class="tag">${g}</span>`);
      }
      tags.innerHTML = tagHtml.join("");
      if (tags.innerHTML) main.appendChild(tags);

      // 详细元信息 (数值字段先做数值校验, 文本经 escapeHtml)
      const meta = document.createElement("div");
      meta.className = "user-meta";
      let metaHtml = "";
      if (country || province || city) {
        const loc = [country, province, city].filter(Boolean).map(v => escapeHtml(String(v))).join(" / ");
        metaHtml += `<span>📍 ${loc}</span>`;
      }
      const num = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : null; };
      if (num(age)) metaHtml += `<span>🎂 ${num(age)} 岁</span>`;
      if (num(fansNum) !== null) metaHtml += `<span>👥 粉丝 ${num(fansNum)}</span>`;
      if (num(followNum) !== null) metaHtml += `<span>➤ 关注 ${num(followNum)}</span>`;
      if (num(songNum) !== null) metaHtml += `<span>🎵 歌曲 ${num(songNum)}</span>`;
      if (num(playlistNum) !== null) metaHtml += `<span>📋 歌单 ${num(playlistNum)}</span>`;
      meta.innerHTML = metaHtml;
      main.appendChild(meta);

      if (intro) {
        const introEl = document.createElement("div");
        introEl.style.cssText = "font-size:12px;color:#8a909c;margin-top:6px;line-height:1.6;";
        introEl.textContent = `“${intro}”`;
        main.appendChild(introEl);
      }

      card.appendChild(main);

      // 原始 JSON (默认展开, 方便核对字段)
      $("rawJson").textContent = JSON.stringify(d, null, 2);
      $("rawJson").classList.remove("hidden");
      $("rawToggle").textContent = "▼ 收起原始 JSON";
    }

    // 原始 JSON 展开/收起
    $("rawToggle").addEventListener("click", () => {
      const box = $("rawJson");
      const toggle = $("rawToggle");
      if (box.classList.contains("hidden")) {
        box.classList.remove("hidden");
        toggle.textContent = "▼ 收起原始 JSON";
      } else {
        box.classList.add("hidden");
        toggle.textContent = "▶ 查看原始 JSON";
      }
    });

    // ==================== Tabs ====================

    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        $("qrPanel").classList.toggle("hidden", tab !== "qr");
        $("phonePanel").classList.toggle("hidden", tab !== "phone");
      });
    });

    // ==================== QQ 二维码 ====================

    let qrIdentifier = null;
    let qrPollTimer = null;
    let qrSession = 0; // 二维码会话代次: 刷新后旧轮询响应全部失效

    async function loadQrCode() {
      // 新二维码使旧会话立即失效: 旧轮询的迟到响应不能再终止新会话
      stopQrPoll();
      qrIdentifier = null;
      qrSession++;
      const session = qrSession;
      $("qrBox").className = "qr-box loading";
      $("qrBox").innerHTML = "";
      $("qrState").className = "qr-state";
      $("qrState").textContent = "正在获取二维码…";
      try {
        const d = await api("/login/qrcode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "qq" })
        });
        if (session !== qrSession) return; // 已有更新的二维码请求
        qrIdentifier = d.identifier;
        $("qrBox").className = "qr-box";
        const img = document.createElement("img");
        img.src = `data:${d.mime};base64,${d.data}`;
        img.alt = "QR";
        $("qrBox").appendChild(img);
        $("qrState").className = "qr-state";
        $("qrState").textContent = "请使用 QQ 扫描二维码";
        startQrPoll();
      } catch (e) {
        if (session !== qrSession) return;
        $("qrState").className = "qr-state err";
        $("qrState").textContent = `获取二维码失败: ${e.message}`;
        showMsg($("qrMsg"), "err", e.message);
      }
    }

    function startQrPoll() {
      stopQrPoll();
      qrPollTimer = setInterval(pollQr, 2000);
    }

    function stopQrPoll() {
      if (qrPollTimer) { clearInterval(qrPollTimer); qrPollTimer = null; }
    }

    async function pollQr() {
      if (!qrIdentifier) return;
      const session = qrSession;
      try {
        const d = await api("/login/checkQrcode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: qrIdentifier, type: "qq" })
        });
        if (session !== qrSession) return; // 旧会话的迟到响应, 丢弃
        const ev = d.event;
        const map = { 0: "DONE", 1: "SCAN", 2: "CONF", 3: "REFUSE", 4: "TIMEOUT", "-1": "OTHER" };
        const name = map[ev] || `UNKNOWN(${ev})`;
        const clsMap = { 0: "done", 1: "scan", 2: "conf", 3: "err", 4: "err", "-1": "err" };
        $("qrState").className = `qr-state ${clsMap[ev] || "err"}`;
        const hintMap = {
          0: "登录成功",
          1: "已扫码，请在手机上确认",
          2: "已确认，正在授权…",
          3: "已拒绝登录",
          4: "二维码已过期，请刷新"
        };
        $("qrState").textContent = `[${name}] ${hintMap[ev] || "未知状态"}`;

        if (ev === 0) {
          stopQrPoll();
          showMsg($("qrMsg"), "ok", "登录成功！");
          checkStatus();
        } else if (ev === 3 || ev === 4 || ev === -1) {
          stopQrPoll();
        }
      } catch (e) {
        if (session !== qrSession) return;
        stopQrPoll();
        $("qrState").className = "qr-state err";
        $("qrState").textContent = `轮询失败: ${e.message}`;
      }
    }

    $("qrRefreshBtn").addEventListener("click", loadQrCode);

    // ==================== 手机验证码 ====================

    let countdownTimer = null;
    function startCountdown(sec) {
      stopCountdown();
      $("countdown").textContent = `${sec}s`;
      $("sendCodeBtn").disabled = true;
      countdownTimer = setInterval(() => {
        sec--;
        if (sec <= 0) {
          stopCountdown();
          $("countdown").textContent = "";
          $("sendCodeBtn").disabled = false;
        } else {
          $("countdown").textContent = `${sec}s`;
        }
      }, 1000);
    }
    function stopCountdown() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    let sendCodeInFlight = false;
    $("sendCodeBtn").addEventListener("click", async () => {
      const phone = $("phoneInput").value.trim();
      const cc = $("ccInput").value.trim() || "86";
      if (!phone) { showMsg($("phoneMsg"), "err", "请输入手机号"); return; }
      // 防重入: 请求未返回前禁用, 防止重复短信/频控
      if (sendCodeInFlight) return;
      sendCodeInFlight = true;
      $("sendCodeBtn").disabled = true;
      try {
        const d = await api("/login/sendAuthcode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: Number(phone), countryCode: Number(cc) })
        });
        if (d.event === "SEND") {
          showMsg($("phoneMsg"), "ok", "验证码已发送，请查收短信");
          startCountdown(60);
        } else if (d.event === "CAPTCHA") {
          showMsg($("phoneMsg"), "err", "需要人机验证，暂不支持");
          $("sendCodeBtn").disabled = false;
        } else if (d.event === "FREQUENCY") {
          showMsg($("phoneMsg"), "err", "发送过于频繁，请稍后再试");
          startCountdown(30);
        } else {
          showMsg($("phoneMsg"), "err", `未知响应: ${d.event}`);
          $("sendCodeBtn").disabled = false;
        }
      } catch (e) {
        showMsg($("phoneMsg"), "err", `发送失败: ${e.message}`);
        $("sendCodeBtn").disabled = false;
      } finally {
        sendCodeInFlight = false;
      }
    });

    $("phoneLoginBtn").addEventListener("click", async () => {
      const phone = $("phoneInput").value.trim();
      const code = $("codeInput").value.trim();
      const cc = $("ccInput").value.trim() || "86";
      if (!phone) { showMsg($("phoneMsg"), "err", "请输入手机号"); return; }
      if (!code) { showMsg($("phoneMsg"), "err", "请输入验证码"); return; }
      try {
        $("phoneLoginBtn").disabled = true;
        await api("/login/phone", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: Number(phone), code, countryCode: Number(cc) })
        });
        showMsg($("phoneMsg"), "ok", "登录成功！");
        checkStatus();
      } catch (e) {
        showMsg($("phoneMsg"), "err", `登录失败: ${e.message}`);
      } finally {
        $("phoneLoginBtn").disabled = false;
      }
    });

    // ==================== 凭证操作 ====================

    $("refreshBtn").addEventListener("click", checkStatus);

    $("refreshCredBtn").addEventListener("click", async () => {
      try {
        $("refreshCredBtn").disabled = true;
        await api("/login/refresh", { method: "POST" });
        showMsg($("statusMsg"), "ok", "凭证已刷新");
        checkStatus();
      } catch (e) {
        showMsg($("statusMsg"), "err", `刷新失败: ${e.message}`);
      } finally {
        $("refreshCredBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      if (!confirm("确定要退出登录吗？")) return;
      try {
        $("logoutBtn").disabled = true;
        await api("/login/logout", { method: "POST" });
        showMsg($("statusMsg"), "ok", "已退出登录");
        checkStatus();
      } catch (e) {
        showMsg($("statusMsg"), "err", `退出失败: ${e.message}`);
      } finally {
        $("logoutBtn").disabled = false;
      }
    });

    $("keyBtn").addEventListener("click", () => {
      // 重新弹出密钥门 (可更换密钥)
      showGate();
    });

    // ==================== 公告/联系方式配置 ====================
    const SITE_FIELDS = ["announcement_enabled", "announcement_title", "announcement_content", "announcement_required_seconds", "contact_enabled", "contact_label", "contact_personal_label", "contact_personal_url", "contact_personal_image", "contact_group_label", "contact_group_url", "contact_group_image"];
    const SITE_INPUTS = ["announcementEnabled", "announcementTitle", "announcementContent", "announcementSeconds", "contactEnabled", "contactLabel", "contactPersonalLabel", "contactPersonalUrl", "contactPersonalImage", "contactGroupLabel", "contactGroupUrl", "contactGroupImage"];
    async function loadSite() {
      const data = await api("/site/admin");
      SITE_FIELDS.forEach((key, index) => {
        const input = $(SITE_INPUTS[index]);
        if (!input) return;
        if (input.type === "checkbox") input.checked = Boolean(data[key]);
        else input.value = data[key] ?? "";
      });
    }
    $("saveSiteBtn").addEventListener("click", async () => {
      const body = {};
      SITE_FIELDS.forEach((key, index) => {
        const input = $(SITE_INPUTS[index]);
        if (!input) return;
        body[key] = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value || 0) : input.value;
      });
      try {
        await api("/site", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        showMsg($("siteMsg"), "ok", "公告配置已保存 (公告内容变化会自动提升版本号)");
      } catch (e) {
        showMsg($("siteMsg"), "err", e.message);
      }
    });

    // 启动: 已存密钥则静默校验, 通过直接进入, 否则停在密钥门
    (async function gateInit() {
      const stored = getAdminKey();
      if (stored && await verifyKey(stored)) {
        enterAdmin(); // loadSite 已并入 enterAdmin, 不再重复调用
      } else {
        if (stored) setAdminKey(""); // 失效密钥清除
        showGate();
      }
    })();
  </script>
</body>
</html>
